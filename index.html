<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15131c">
<title>Ma watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#15131c;--sf:#1f1c29;--sf2:#292536;--ln:#38334a;--tx:#f1eef7;--mu:#a29cb6;--ac:#ffb84d;--ac-tx:#1b1203;--ok:#6ee7a8;--er:#ff7a8a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px;max-width:900px;margin:auto}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
main{max-width:900px;margin:auto;padding:8px 18px 24px}
h2{font-size:15px;font-weight:600;color:var(--mu);margin:22px 0 10px}
.ic{width:42px;height:42px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-width:0;max-width:180px;padding:10px 2px 9px;color:var(--mu);font-size:12px;display:grid;gap:2px;justify-items:center}
nav button b{font-size:20px;font-weight:400;display:grid;place-items:center;height:24px;line-height:1}
nav button[aria-current=page]{color:var(--ac)}
.card{display:flex;gap:14px;background:var(--sf);border-radius:14px;padding:10px;margin-bottom:10px}
.card img,.ph{width:72px;height:108px;object-fit:cover;border-radius:8px;background:var(--sf2);flex:none}
.card .bd{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.name{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.ep{font-size:26px;font-weight:800;color:var(--ac);letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--mu);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:5px;background:var(--sf2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.btn{background:var(--ac);color:var(--ac-tx);font-weight:600;padding:9px 16px;border-radius:99px;align-self:flex-start}
.btn.alt{background:var(--sf2);color:var(--tx)}
.btn.sm{padding:6px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.grid button{text-align:left;display:block}
.grid img,.grid .ph{width:100%;height:auto;aspect-ratio:2/3;border-radius:10px;display:block;object-fit:cover}
.grid .t{font-size:13px;margin-top:5px;line-height:1.25}
.it{position:relative}
.grid button.x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(21,19,28,.85);color:var(--tx);font-size:12px;display:grid;place-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:10px 0}
.chip{padding:6px 14px;border-radius:99px;background:var(--sf);color:var(--mu);white-space:nowrap;font-size:14px}
.chip[aria-pressed=true]{background:var(--ac);color:var(--ac-tx);font-weight:600}
input[type=search],input[type=text],input[type=email],input[type=password],select,textarea{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--sf);border-radius:14px;padding:16px}
.stat b{display:block;font-size:34px;font-weight:800;color:var(--ac);letter-spacing:-.02em}
.stat span{color:var(--mu);font-size:14px}
.empty{color:var(--mu);padding:36px 8px;text-align:center}
.day{color:var(--ac);font-weight:600;margin:20px 0 8px;text-transform:capitalize}
.row{display:flex;gap:12px;align-items:center;background:var(--sf);border-radius:12px;padding:8px;margin-bottom:8px;width:100%;text-align:left}
.row img,.row .ph{width:40px;height:60px;border-radius:6px}
dialog{border:0;border-radius:18px;background:var(--bg);color:var(--tx);width:min(640px,94vw);max-height:90vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.65)}
.dh{display:flex;gap:14px;padding:18px;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--ln)}
.dh img{width:84px;border-radius:8px}
.dc{padding:6px 18px 22px}
details{background:var(--sf);border-radius:12px;margin-top:10px}
summary{padding:12px 14px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.e{display:flex;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--ln);font-size:15px}
.e input{width:20px;height:20px;accent-color:var(--ac);flex:none}
.e .d{margin-left:auto;color:var(--mu);font-size:13px;white-space:nowrap}
.e.fut{opacity:.55}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw}
.foot{color:var(--mu);font-size:12px;margin-top:30px;text-align:center}
.foot img{height:12px;vertical-align:middle;margin-left:6px}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:active{transform:scale(.99)}}
</style>
</head>
<body>
<header><h1 id="ttl">Ma watchlist</h1></header>
<main id="app"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
// Clé TMDB partagée par tous les utilisateurs de l’appli (lecture seule).
const KEY_DEFAULT = "9bbfacd52e0797f23fba7e1905b2d015";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IMG = "https://image.tmdb.org/t/p/w342";
const ST = {watching:"En cours", later:"À voir plus tard", done:"Terminées", stopped:"Abandonnées"};
let S = load(), tab = "watch", filter = "all", results = null, openId = null, kind = "tv", openKind = "tv";
S.movies = S.movies || {}; S.del = S.del || {};

function load(){ try { return JSON.parse(localStorage.getItem("sf")) || {shows:{},key:""}; } catch { return {shows:{},key:""}; } }
function saveLocal(){ try { localStorage.setItem("sf", JSON.stringify(S)); } catch { toast("Sauvegarde impossible sur ce navigateur"); } }
function save(){ saveLocal(); schedPush(); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmt = a => new Date(a+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const code = e => "S"+String(e.s).padStart(2,"0")+"E"+String(e.e).padStart(2,"0");
const k = e => e.s+"-"+e.e;
const poster = (p,c="") => p ? `<img src="${IMG+esc(p)}" alt="" loading="lazy" class="${c}">` : `<div class="ph ${c}"></div>`;

async function api(path, params={}){
  const key = KEY_DEFAULT;
  const u = new URL("https://api.themoviedb.org/3"+path);
  u.searchParams.set("language","fr-FR");
  Object.entries(params).forEach(([a,b])=>u.searchParams.set(a,b));
  const opt = {};
  if (key.length > 40) opt.headers = {Authorization:"Bearer "+key}; else u.searchParams.set("api_key",key);
  const r = await fetch(u, opt);
  if (r.status === 401) throw new Error("Clé TMDB invalide");
  if (!r.ok) throw new Error("Erreur TMDB ("+r.status+")");
  return r.json();
}

async function fetchShow(id){
  const d = await api("/tv/"+id);
  const seasons = d.seasons.filter(s=>s.season_number>0);
  const data = await Promise.all(seasons.map(s=>api(`/tv/${id}/season/${s.season_number}`).catch(()=>null)));
  const rt = (d.episode_run_time||[])[0] || 40, eps = [];
  data.forEach(s=>s && s.episodes.forEach(e=>eps.push({s:e.season_number,e:e.episode_number,n:e.name||"",a:e.air_date||"",r:e.runtime||rt})));
  return {name:d.name, poster:d.poster_path, tmdb:d.status, eps, upd:Date.now()};
}
async function addShow(id,status){
  try {
    const d = await fetchShow(id);
    S.shows[id] = {id, ...d, status, watched:{}, added:Date.now(), mod:Date.now()};
    save(); toast(d.name+" ajoutée"); render();
  } catch(e){ toast(e.message); }
}
async function refresh(id){
  const sh = S.shows[id]; if(!sh) return;
  try { Object.assign(sh, await fetchShow(id)); save(); } catch {}
}
function autoDone(sh){
  const aired = sh.eps.filter(e=>e.a && e.a<=today());
  if (sh.status==="watching" && aired.length && aired.every(e=>sh.watched[k(e)]) && ["Ended","Canceled"].includes(sh.tmdb)) { sh.status="done"; sh.mod=Date.now(); }
}

const aired = sh => sh.eps.filter(e=>e.a && e.a<=today());
const nextEp = sh => aired(sh).find(e=>!sh.watched[k(e)]);
const seen = sh => sh.eps.filter(e=>sh.watched[k(e)]).length;

function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  const A = $("#app"), shows = Object.values(S.shows), movies = Object.values(S.movies), t = today();
  const foot = `<p class="foot">Données fournies par TMDB. Cette appli utilise l’API TMDB mais n’est ni approuvée ni certifiée par TMDB.<br>Version 3</p>`;
  const stl = m => [m.release?m.release.slice(0,4):"", m.runtime?Math.floor(m.runtime/60)+" h "+String(m.runtime%60).padStart(2,"0"):""].filter(Boolean).join(" · ");
  const kinds = `<div class="chips">${[["tv","Séries"],["movie","Films"]].map(([v,l])=>`<button class="chip" data-kind="${v}" aria-pressed="${kind===v}">${l}</button>`).join("")}</div>`;
  if (tab==="watch"){
    const list = shows.filter(s=>s.status==="watching").map(s=>({s,n:nextEp(s)})).filter(x=>x.n)
      .sort((a,b)=>(b.s.last||0)-(a.s.last||0));
    const mv = movies.filter(m=>m.status==="later"&&(!m.release||m.release<=t)).sort((a,b)=>(b.added||0)-(a.added||0));
    let h = list.map(({s,n})=>{
      const left = aired(s).filter(e=>!s.watched[k(e)]).length;
      return `<div class="card">${poster(s.poster)}<div class="bd">
        <button class="name" data-open="${s.id}">${esc(s.name)}</button>
        <div class="ep">${code(n)}</div><div class="sub">${esc(n.n)}</div>
        <div class="bar"><i style="width:${Math.round(seen(s)/Math.max(s.eps.length,1)*100)}%"></i></div>
        <div style="display:flex;gap:10px;align-items:center;margin-top:4px"><button class="btn" data-seen="${s.id}">Vu</button><span class="sub">${left>1?left+" épisodes à rattraper":"à jour après celui-ci"}</span></div></div></div>`;
    }).join("");
    if (mv.length) h += `<h2>Films à voir</h2>` + mv.map(m=>`<div class="card">${poster(m.poster)}<div class="bd"><button class="name" data-openm="${m.id}">${esc(m.name)}</button><div class="sub">${esc(stl(m))}</div><div style="margin-top:4px"><button class="btn" data-mseen="${m.id}">Vu</button></div></div></div>`).join("");
    A.innerHTML = (h || `<p class="empty">${shows.length||movies.length?"Tout est à jour. Rien à regarder pour l’instant.":"Rien dans ta liste pour l’instant. Cherche une série ou un film dans l’onglet Chercher."}</p>`) + foot;
  }
  if (tab==="cal"){
    const ev = [];
    shows.filter(s=>s.status==="watching"||s.status==="later").forEach(s=>s.eps.filter(e=>e.a>=t).forEach(e=>ev.push({d:e.a,s,e})));
    movies.filter(m=>m.status==="later"&&m.release>=t).forEach(m=>ev.push({d:m.release,m}));
    const nm = x => x.s ? x.s.name : x.m.name;
    ev.sort((x,y)=>x.d.localeCompare(y.d)||nm(x).localeCompare(nm(y)));
    let last = "";
    A.innerHTML = ev.length ? ev.slice(0,120).map(x=>{
      const h = x.d!==last ? `<div class="day">${x.d===t?"Aujourd’hui":fmt(x.d)}</div>` : ""; last=x.d;
      return h + (x.m
        ? `<button class="row" data-openm="${x.m.id}">${poster(x.m.poster)}<div><div class="name">${esc(x.m.name)}</div><div class="sub">Sortie du film</div></div></button>`
        : `<button class="row" data-open="${x.s.id}">${poster(x.s.poster)}<div><div class="name">${esc(x.s.name)}</div><div class="sub">${code(x.e)} ${esc(x.e.n)}</div></div></button>`);
    }).join("") : `<p class="empty">Aucune sortie à venir pour tes séries et tes films.</p>`;
  }
  if (tab==="list"){
    const mv = kind==="movie", src = mv?movies:shows, sts = mv?{later:"À voir",done:"Vus"}:ST;
    const f = filter==="all" ? src : src.filter(x=>x.status===filter);
    A.innerHTML = kinds + `<div class="chips">${[["all","Tous"],...Object.entries(sts)].map(([v,l])=>`<button class="chip" data-f="${v}" aria-pressed="${filter===v}">${l}</button>`).join("")}</div>`
      + (f.length ? `<div class="grid">${f.sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<div class="it"><button data-${mv?"openm":"open"}="${x.id}">${poster(x.poster)}<div class="t">${esc(x.name)}</div></button><button class="x" data-del="${mv?"m":"s"}:${x.id}" aria-label="Retirer ${esc(x.name)} de ma liste">✕</button></div>`).join("")}</div>` : `<p class="empty">Rien dans cette catégorie.</p>`);
  }
  if (tab==="search"){
    A.innerHTML = kinds + `<input type="search" id="q" placeholder="${kind==="movie"?"Rechercher un film":"Rechercher une série"}" aria-label="Rechercher" autocomplete="off"><div id="res"></div>`;
    $("#q").addEventListener("input", debounce(doSearch, 350));
    if (results) showResults(); else trending();
  }
  if (tab==="stats"){
    let eps=0,min=0; shows.forEach(s=>s.eps.forEach(e=>{ if(s.watched[k(e)]){eps++;min+=e.r||40;} }));
    const seenM = movies.filter(m=>m.status==="done"); seenM.forEach(m=>min+=m.runtime||100);
    const d=Math.floor(min/1440), h=Math.floor(min%1440/60);
    A.innerHTML = `<div class="stats">
      <div class="stat"><b>${eps}</b><span>épisodes vus</span></div>
      <div class="stat"><b>${seenM.length}</b><span>films vus</span></div>
      <div class="stat"><b>${d?d+" j ":""}${h} h</b><span>passées devant l’écran</span></div>
      <div class="stat"><b>${shows.length}</b><span>séries suivies</span></div>
      <div class="stat"><b>${shows.filter(s=>s.status==="done").length}</b><span>séries terminées</span></div>
      <div class="stat"><b>${movies.length-seenM.length}</b><span>films à voir</span></div></div>`;
  }
  if (tab==="profile"){
    A.innerHTML = accHtml() + `<h2>Sauvegarde</h2><p class="sub" style="white-space:normal">Connecté, tes données se synchronisent toutes seules. Tu peux aussi les exporter dans un fichier.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn alt sm" id="exp">Exporter</button><label class="btn alt sm">Importer<input type="file" id="imp" accept="application/json" hidden></label><button class="btn alt sm" id="all">Actualiser toutes les séries</button></div>` + foot;
  }
}

function debounce(f,ms){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>f(...a),ms);}; }
async function doSearch(){
  const q = $("#q").value.trim();
  if (!q){ results=null; return trending(); }
  try { results = (await api(kind==="movie"?"/search/movie":"/search/tv",{query:q})).results; showResults(); } catch(e){ $("#res").innerHTML=`<p class="empty">${esc(e.message)}</p>`; }
}
async function trending(){
  try { results = null; const r = (await api(kind==="movie"?"/trending/movie/week":"/trending/tv/week")).results; $("#res") && ($("#res").innerHTML = `<h2>Tendances de la semaine</h2>`+resHtml(r)); }
  catch(e){ $("#res") && ($("#res").innerHTML = `<p class="empty">${esc(e.message)}</p>`); }
}
function showResults(){ $("#res").innerHTML = results.length ? resHtml(results) : `<p class="empty">Aucun résultat.</p>`; }
function resHtml(list){
  const mv = kind==="movie";
  return list.slice(0,20).map(r=>{
    const mine = (mv?S.movies:S.shows)[r.id], nm = mv?r.title:r.name, dt = (mv?r.release_date:r.first_air_date)||"";
    const btns = mine ? `<button class="btn alt sm" data-${mv?"openm":"open"}="${r.id}">Dans ta liste</button>`
      : mv ? `<div style="display:flex;gap:8px"><button class="btn sm" data-addm="${r.id}" data-st="later">À voir</button><button class="btn alt sm" data-addm="${r.id}" data-st="done">Déjà vu</button></div>`
      : `<div style="display:flex;gap:8px"><button class="btn sm" data-add="${r.id}" data-st="watching">Suivre</button><button class="btn alt sm" data-add="${r.id}" data-st="later">Plus tard</button></div>`;
    return `<div class="card">${poster(r.poster_path)}<div class="bd"><div class="name">${esc(nm)}</div>
      <div class="sub">${esc(dt.slice(0,4))}</div>
      <div class="sub" style="white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(r.overview)}</div>${btns}</div></div>`;
  }).join("");
}
async function addMovie(id,status){
  try {
    const d = await api("/movie/"+id);
    S.movies[id] = {id, name:d.title, poster:d.poster_path, release:d.release_date||"", runtime:d.runtime||0, ov:d.overview||"", status, added:Date.now(), mod:Date.now()};
    if (status==="done") S.movies[id].last = Date.now();
    save(); toast(d.title+" ajouté"); render();
  } catch(e){ toast(e.message); }
}
function toggleMovie(id){ const m=S.movies[id]; m.status = m.status==="done"?"later":"done"; m.last=Date.now(); m.mod=Date.now(); save(); }
function removeItem(c,id){ if(!confirm("Retirer de ta liste ?")) return; delete (c==="m"?S.movies:S.shows)[id]; S.del[(c==="m"?"m":"")+id]=Date.now(); save(); render(); }
function openMovie(id){
  const m = S.movies[id]; if(!m) return; openId = id; openKind = "movie";
  const done = m.status==="done", dt = m.release ? new Date(m.release+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}) : "";
  $("#dlg").innerHTML = `<div class="dh">${poster(m.poster)}<div style="flex:1;min-width:0"><div class="name" style="white-space:normal;font-size:20px">${esc(m.name)}</div>
    <div class="sub">${esc([dt,m.runtime?Math.floor(m.runtime/60)+" h "+String(m.runtime%60).padStart(2,"0"):""].filter(Boolean).join(" · "))}</div>
    <button class="btn sm" style="margin-top:10px" data-mseen="${id}">${done?"Remettre à voir":"Marquer comme vu"}</button></div>
    <button class="ic" data-close aria-label="Fermer">✕</button></div>
    <div class="dc"><p style="margin-top:12px">${esc(m.ov)||"Pas de résumé disponible."}</p><div style="margin-top:18px"><button class="btn alt sm" style="color:var(--er)" data-remove>Retirer de ma liste</button></div></div>`;
  if(!$("#dlg").open) $("#dlg").showModal();
}
function openShow(id){
  const s = S.shows[id]; if(!s) return;
  openId = id; openKind = "tv";
  const seasons = [...new Set(s.eps.map(e=>e.s))], t = today();
  $("#dlg").innerHTML = `<div class="dh">${poster(s.poster)}<div style="flex:1;min-width:0"><div class="name" style="white-space:normal;font-size:20px">${esc(s.name)}</div>
    <div class="sub">${seen(s)} / ${s.eps.length} épisodes vus</div>
    <select id="stsel" aria-label="Statut" style="margin-top:8px;padding:8px 10px">${Object.entries(ST).map(([v,l])=>`<option value="${v}" ${s.status===v?"selected":""}>${l}</option>`).join("")}</select></div>
    <button class="ic" data-close aria-label="Fermer">✕</button></div>
    <div class="dc">${seasons.map(n=>{
      const es = s.eps.filter(e=>e.s===n), v = es.filter(e=>s.watched[k(e)]).length;
      return `<details ${n===seasons[seasons.length-1]||v<es.length&&v>0?"open":""}><summary><span>Saison ${n}</span><span class="sub">${v}/${es.length}</span></summary>
        <div class="e"><button class="btn alt sm" data-all="${n}">${v===es.length?"Tout décocher":"Tout cocher"}</button></div>

      <div style="display:flex;gap:10px;margin-top:18px"><button class="btn alt sm" data-refresh>Actualiser</button><button class="btn alt sm" style="color:var(--er)" data-remove>Retirer de ma liste</button></div></div>`;
  if(!$("#dlg").open) $("#dlg").showModal();
}
function reopen(){ const d=$("#dlg"), y=d.scrollTop, open=[...d.querySelectorAll("details")].map(x=>x.open); openShow(openId); d.querySelectorAll("details").forEach((x,i)=>x.open=open[i]); d.scrollTop=y; }

document.addEventListener("click", async e=>{
  const t = e.target.closest("button,label"); if(!t) return;
  const d = t.dataset;
  if (d.tab){ tab=d.tab; if(tab==="search") results=null; return render(); }
  if (d.f){ filter=d.f; return render(); }
  if (d.kind){ kind=d.kind; filter="all"; results=null; return render(); }
  if (d.openm) return openMovie(+d.openm);
  if (d.addm) return addMovie(+d.addm,d.st);
  if (d.mseen){ toggleMovie(d.mseen); toast(S.movies[d.mseen].status==="done"?"Film marqué comme vu":"Remis dans à voir"); if($("#dlg").open) openMovie(+d.mseen); return render(); }
  if (d.del){ const [c,id]=d.del.split(":"); return removeItem(c,id); }
  if (d.open) return openShow(+d.open);
  if (d.close!==undefined) return t.closest("dialog").close();
  if (d.add) return addShow(+d.add,d.st);
  if (d.seen){ const s=S.shows[d.seen], n=nextEp(s); s.watched[k(n)]=Date.now(); s.last=Date.now(); s.mod=Date.now(); autoDone(s); save(); toast(code(n)+" vu"); return render(); }
  if (d.all){ const s=S.shows[openId], es=s.eps.filter(x=>x.s==d.all&&x.a&&x.a<=today()), all=es.every(x=>s.watched[k(x)]);
    es.forEach(x=>{ if(all) delete s.watched[k(x)]; else s.watched[k(x)]=s.watched[k(x)]||Date.now(); }); s.last=Date.now(); s.mod=Date.now(); autoDone(s); save(); reopen(); return render(); }
  if (d.refresh!==undefined){ await refresh(openId); toast("Série actualisée"); reopen(); return render(); }
  if (d.remove!==undefined){ if(confirm("Retirer de ta liste ?")){ (openKind==="movie"?delete S.movies[openId]:delete S.shows[openId]); S.del[(openKind==="movie"?"m":"")+openId]=Date.now(); save(); $("#dlg").close(); render(); } return; }
  if (t.id==="google"){ const pr=new firebase.auth.GoogleAuthProvider(); try { await auth.signInWithPopup(pr); } catch(x){ if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(x.code)) auth.signInWithRedirect(pr); else fbErr(x); } return; }
  if (t.id==="login"||t.id==="signup"){ const em=$("#em").value.trim(), pw=$("#pw").value; if(!em||!pw) return toast("Saisis ton e-mail et ton mot de passe"); try { await (t.id==="login"?auth.signInWithEmailAndPassword(em,pw):auth.createUserWithEmailAndPassword(em,pw)); } catch(x){ fbErr(x); } return; }
  if (t.id==="forgot"){ const em=$("#em").value.trim(); if(!em) return toast("Saisis d’abord ton e-mail"); try { await auth.sendPasswordResetEmail(em); toast("E-mail de réinitialisation envoyé"); } catch(x){ fbErr(x); } return; }
  if (t.id==="logout"){ await auth.signOut(); return toast("Déconnecté"); }
  if (t.id==="syncnow"){ await pull(); return; }
  if (t.id==="exp"){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"})); a.download="mes-series-"+today()+".json"; a.click(); return; }
  if (t.id==="all"){ toast("Actualisation…"); for(const id of Object.keys(S.shows)) await refresh(id); toast("Toutes les séries sont à jour"); return render(); }
});
document.addEventListener("change", e=>{

  if (t.id==="imp"){ const f=t.files[0]; if(!f) return; f.text().then(x=>{ try { const j=JSON.parse(x); if(!j.shows) throw 0; S=j; S.movies=S.movies||{}; S.del=S.del||{}; [...Object.values(S.shows),...Object.values(S.movies)].forEach(x=>x.mod=Date.now()); save(); render(); toast("Données importées"); } catch { toast("Fichier invalide"); } }); }
});

const FB = {apiKey:"AIzaSyC1PZnqugIE0tEJLSiFXrPdcvgT1uNXtzw",authDomain:"cineserie-9ca6d.firebaseapp.com",projectId:"cineserie-9ca6d",storageBucket:"cineserie-9ca6d.firebasestorage.app",messagingSenderId:"963694716545",appId:"1:963694716545:web:5483588d4f699178c24f80"};
let auth, db, user=null, unsub=null, pushT, sync="", cloudInfo="inconnu";
const ERR = {"auth/invalid-credential":"E-mail ou mot de passe incorrect","auth/wrong-password":"E-mail ou mot de passe incorrect","auth/user-not-found":"E-mail ou mot de passe incorrect","auth/email-already-in-use":"Cet e-mail a déjà un compte, connecte-toi","auth/weak-password":"Mot de passe trop court (6 caractères minimum)","auth/invalid-email":"Adresse e-mail invalide","auth/popup-closed-by-user":"Connexion annulée","auth/unauthorized-domain":"Domaine non autorisé dans Firebase","auth/network-request-failed":"Pas de connexion internet","auth/too-many-requests":"Trop d’essais, réessaie plus tard"};
const fbErr = e => toast(ERR[e.code] || ("Erreur : "+(e.code||e.message)));
const stamp = () => "Synchronisé à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const refreshSet = () => { if(tab==="profile") render(); };
function accHtml(){
  if(!window.firebase) return `<h2>Compte</h2><p class="sub" style="white-space:normal">Synchronisation indisponible (pas de connexion ?).</p>`;
  if(user) return `<h2>Compte et synchronisation</h2><p class="sub" style="white-space:normal">Connecté : ${esc(user.email)}<br>${esc(sync)}<br>Dans le cloud : ${esc(cloudInfo)}</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn alt sm" id="syncnow">Synchroniser</button><button class="btn alt sm" id="logout">Se déconnecter</button></div>`;
  return `<h2>Compte (pour synchroniser tes appareils)</h2><button class="btn sm" id="google">Continuer avec Google</button>

}
const light = () => ({del:S.del||{}, movies:S.movies, shows:Object.fromEntries(Object.values(S.shows).map(s=>[s.id,{id:s.id,name:s.name,poster:s.poster,status:s.status,watched:s.watched,added:s.added,last:s.last,mod:s.mod||0,tmdb:s.tmdb}]))});
async function pull(){
  if(!user) return; sync="Synchro en cours…"; refreshSet();
  try { const sn = await db.doc("users/"+user.uid).get({source:"server"}); if(sn.exists) mergeIn(JSON.parse(sn.data().json)); else await push(); }
  catch(e){ sync="Échec de la synchro ("+(e.code||e.message)+")"; }
  refreshSet();
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && user) pull(); });
function schedPush(){ if(!user) return; clearTimeout(pushT); pushT=setTimeout(push,1500); }
function push(){
  if(!user) return; sync="Synchro en cours…"; const tm=setTimeout(()=>{ if(sync==="Synchro en cours…"){ sync="Pas de réponse de Firestore : base non créée ou bloqueur de pub ?"; refreshSet(); } },10000);
  return db.doc("users/"+user.uid).set({json:JSON.stringify(light()),upd:Date.now()})
    .then(()=>{ sync=stamp(); cloudInfo=Object.keys(S.shows).length+" séries, "+Object.keys(S.movies).length+" films"; }).catch(e=>{ sync="Échec de la synchro ("+e.code+")"; toast(sync); }).finally(()=>{ clearTimeout(tm); refreshSet(); });
}
// Fusion : pour chaque série ou film, la version modifiée en dernier l’emporte ; les suppressions sont mémorisées.
function mergeIn(r){
  S.del = S.del||{}; let need = false; cloudInfo = Object.keys(r.shows||{}).length+" séries, "+Object.keys(r.movies||{}).length+" films";
  Object.entries(r.del||{}).forEach(([id,ts])=>{ if((S.del[id]||0)<ts) S.del[id]=ts; });
  [["shows",""],["movies","m"]].forEach(([c,pf])=>{
    const L=S[c], R=r[c]||{};
    Object.keys(L).forEach(id=>{ const ts=S.del[pf+id]; if(ts && ts>=(L[id].mod||0)) delete L[id]; });
    Object.entries(R).forEach(([id,rs])=>{
      const ts=S.del[pf+id]; if(ts && ts>=(rs.mod||0)) return;
      const l=L[id];
      if(!l || (rs.mod||0)>(l.mod||0)) L[id]={...l,...rs,...(c==="shows"?{eps:(l&&l.eps)||[]}:{})};
    });
    if(Object.values(L).some(x=>!R[x.id]||(x.mod||0)>(R[x.id].mod||0))) need=true;
  });
  if(Object.keys(S.del).some(id=>!(r.del&&r.del[id]))) need=true;
  sync=stamp(); saveLocal(); render();
  Object.values(S.shows).filter(s=>!s.eps||!s.eps.length).forEach(s=>refresh(s.id).then(render));
  if(need) schedPush();
}
if(window.firebase){
  try {
    firebase.initializeApp(FB); auth=firebase.auth(); db=firebase.firestore(); db.settings({experimentalAutoDetectLongPolling:true});
    auth.getRedirectResult().catch(fbErr);
    auth.onAuthStateChanged(u=>{
      user=u; if(unsub){unsub(); unsub=null;} sync="";
      if(u){ sync="Connexion…"; setTimeout(()=>{ if(sync==="Connexion…"){ sync="Pas de réponse de Firestore : base non créée ou bloqueur de pub ?"; refreshSet(); } },12000);
        unsub=db.doc("users/"+u.uid).onSnapshot(sn=>{
          if(sn.metadata.hasPendingWrites) return;
          if(sn.exists){ try { mergeIn(JSON.parse(sn.data().json)); } catch(e){ console.error(e); } } else push();
          refreshSet();
        }, e=>{ sync="Synchro impossible ("+e.code+")"; refreshSet(); });
      }
      refreshSet();
    });
  } catch(e){ console.error(e); }
}
